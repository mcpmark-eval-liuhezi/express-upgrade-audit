<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Express Upgrade Audit - Sign-off Gate</title>
<style>
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0d1117; color: #c9d1d9; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  main { text-align: center; padding: 2rem; }
  h1 { color: #58a6ff; font-size: 1.6rem; margin-bottom: 0.25rem; }
  p.sub { color: #8b949e; margin-top: 0; }
  .status { margin-top: 2rem; font-size: 1.5rem; font-weight: 700; letter-spacing: 0.04em; padding: 1rem 2rem; border-radius: 8px; display: inline-block; background: #161b22; border: 1px solid #30363d; }
  .status.recorded { color: #3fb950; border-color: #238636; }
  .status.cancelled { color: #f85149; border-color: #da3633; }
  .hint { margin-top: 2rem; color: #8b949e; font-size: 0.85rem; }
</style>
</head>
<body>
<main>
  <h1>Express Upgrade Audit</h1>
  <p class="sub">Team sign-off gate for the Express 4.21.2 &#8594; 5.3.0 upgrade audit</p>
  <div id="status" class="status">Awaiting confirmation&hellip;</div>
  <p class="hint">A confirmation prompt is shown when this page is opened. Accepting records the sign-off; declining cancels it.</p>
</main>
<script>
(function () {
  var proceed = window.confirm('Proceed with the Express upgrade audit?');
  var status = document.getElementById('status');
  status.textContent = proceed ? 'SIGN-OFF RECORDED' : 'SIGN-OFF CANCELLED';
  status.className = 'status ' + (proceed ? 'recorded' : 'cancelled');
})();
</script>
</body>
</html>
